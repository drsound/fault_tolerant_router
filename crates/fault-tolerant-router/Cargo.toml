[package]
name = "fault-tolerant-router"
description = "Multi-uplink policy routing daemon for Linux routers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fault_tolerant_router"

[[bin]]
name = "fault-tolerant-router"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
ipnet.workspace = true
# Pre-1.0 netlink crates are pinned exactly (IMPL-2).
netlink-packet-core = "=0.9.0"
netlink-packet-route = "=0.33.0"
netlink-proto = { version = "=0.13.0", default-features = false, features = ["tokio_socket"] }
netlink-sys = { version = "=0.9.0", features = ["tokio_socket"] }
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "process", "signal", "io-util"] }
toml.workspace = true

[lints]
workspace = true
