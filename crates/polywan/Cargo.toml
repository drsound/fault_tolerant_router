[package]
name = "polywan"
description = "Multi-uplink policy routing daemon for Linux routers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["multi-wan", "failover", "load-balancing", "policy-routing", "nftables"]
categories = ["command-line-utilities", "network-programming"]

[features]
# Hooks for the acceptance scenarios (src/test_hooks.rs); never in releases.
test-hooks = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
# The API sockets, the metrics listener and the CLI's client, without a web
# framework (IMPL-2, Q19).
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1.11", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
ipnet.workspace = true
# Pre-1.0 netlink crates are pinned exactly (IMPL-2).
netlink-packet-core = "=0.9.0"
netlink-packet-route = "=0.33.0"
netlink-proto = { version = "=0.13.0", default-features = false, features = ["tokio_socket"] }
netlink-sys = { version = "=0.9.0", features = ["tokio_socket"] }
# Account lookup, process-group signals and file flags without unsafe code
# in PolyWAN (IMPL-2).
nix = { workspace = true, features = ["user", "signal", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "process", "signal", "io-util"] }
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
