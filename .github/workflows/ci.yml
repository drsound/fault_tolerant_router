# Quality gates of SPEC.md §14.4.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runners use a fixed image: the namespace suite depends on its kernel and
# packages, and ubuntu-latest moves between releases over several weeks.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Verify the unit file
        # systemd-analyze checks that ExecStart= names an executable.
        run: |
          sudo install -m 0755 target/debug/polywan /usr/bin/polywan
          systemd-analyze verify --man=no packaging/polywan.service

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  netns-current:
    name: namespace suite (runner kernel, current nftables)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools jq iproute2 nftables dnsmasq-base ppp pppoe udhcpc iputils-ping conntrack tcpdump kea-dhcp6-server dhcpcd-base
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          # The harness runs its own kea-dhcp6 inside a namespace (AS-44).
          sudo systemctl disable --now kea-dhcp6-server || true
      - name: Let dnsmasq write its files in the harness directory
        # Ubuntu confines dnsmasq with AppArmor; the harness keeps leases,
        # pid and log files in its own run directory.
        run: |
          if [ -e /etc/apparmor.d/usr.sbin.dnsmasq ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.dnsmasq /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.dnsmasq || true
          fi
      - name: Cache the upstream nftables build
        id: nft-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/polywan-nftables
          key: nftables-ubuntu-26.04-${{ hashFiles('tests/ci/build-nftables.sh') }}
      - name: Build the newest upstream nftables
        # The runner's distribution ships an older nftables; §14.1 asks for a
        # current one. It is installed in /usr/local/sbin, which comes before
        # /usr/sbin in sudo's secure_path, as a copy owned by root: PolyWAN
        # checks the trust of the nft it runs before every execution
        # (FR-CFG-5), and the build directory belongs to the runner's user.
        run: |
          sudo apt-get install -y --no-install-recommends libjansson-dev
          if [ "${{ steps.nft-cache.outputs.cache-hit }}" != true ]; then
            tests/ci/build-nftables.sh ~/.cache/polywan-nftables
          fi
          sudo install -o root -g root -m 0755 ~/.cache/polywan-nftables/sbin/nft /usr/local/sbin/nft
      - run: uname -r && sudo nft --version
      - run: tests/vm/run-suite.sh --host
        env:
          # The scenarios wait more than they compute.
          POLYWAN_PARALLEL_MASKS: 1

  netns-minimum:
    name: namespace suite (Linux 6.1, nftables 1.0.6)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools jq mmdebstrap debian-archive-keyring qemu-system-x86 busybox-static
          pipx install virtme-ng==1.35
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the Debian 12 root filesystem
        run: sudo tests/vm/build-rootfs.sh "$RUNNER_TEMP/rootfs-bookworm"
      - run: tests/vm/run-suite.sh --vm "$RUNNER_TEMP/rootfs-bookworm"
        env:
          # The M1 scenarios run three times (AS-43); use the runner's cores.
          VM_CPUS: 4
          VM_MEMORY: 3G
          VM_TEST_THREADS: 3

  release-targets:
    # Static release builds for every PLAT-3 target (§14.4). The binaries are
    # pure Rust; rust-lld links them against the self-contained musl objects
    # of each target, so no cross C toolchain is needed.
    name: release build (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p polywan \
            --config 'target.${{ matrix.target }}.linker="rust-lld"'
          file target/${{ matrix.target }}/release/polywan
          file target/${{ matrix.target }}/release/polywan | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@v7
        with:
          name: polywan-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/polywan
          if-no-files-found: error
