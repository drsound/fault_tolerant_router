# A release from a v2.* tag (SPEC.md DIST-1): the binaries and packages of
# the build workflow, their SHA-256 checksums and GitHub artifact
# attestations, the third-party notices and the build provenance, in a
# draft GitHub release that the maintainer reviews and publishes. The crate
# is published on crates.io by hand, with the maintainer's token. Every
# action is pinned by commit (its version in the comment): a tag or a
# branch can be moved, and what the build runs ends up attested.
name: Release

on:
  push:
    tags: ["v2.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag, change log and crate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable
      - name: CI passed on the tagged commit
        # The quality gates of §14.4 run on the branch push (CI skips
        # tags): a release needs a successful CI run of the same commit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" = 0 ]; then
            echo "::error::no successful CI run for $GITHUB_SHA: wait for it (or fix it), then re-run this workflow"
            exit 1
          fi
      - name: The tag names the workspace version
        # A pre-release (2.0.0-rc.1) takes the change log section of its
        # release; a release needs that section dated.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name the version $version"
            exit 1
          fi
          heading=$(grep -E "^## ${version%%-*} \(" CHANGELOG.md || true)
          case $version in
          *-*) pattern='^## [^ ]+ \(' ;;
          *) pattern='^## [^ ]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$' ;;
          esac
          if ! printf %s "$heading" | grep -Eq "$pattern"; then
            echo "::error::CHANGELOG.md has no section for $version (or it is not dated)"
            exit 1
          fi
      - name: The crate as crates.io would receive it
        run: cargo publish -p polywan --locked --dry-run

  build:
    uses: ./.github/workflows/build.yml
    with:
      cache: false

  release:
    name: draft release
    needs: [check, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: polywan-*
          path: dist
          merge-multiple: true
      - name: Assemble the release files
        # The notices are the packages' own, the same in every package.
        run: |
          cd dist
          for f in THIRD-PARTY-LICENSES rust-std-copyright.html; do
            for deb in polywan_*.deb; do
              dpkg-deb --fsys-tarfile "$deb" | tar -xO "./usr/share/doc/polywan/$f.gz" | gunzip >"$f.$deb"
            done
            for copy in "$f".polywan_*.deb; do cmp "$f".polywan_*_amd64.deb "$copy"; done
            mv "$f".polywan_*_amd64.deb "$f"
            rm "$f".polywan_*.deb
          done
          cat provenance-*.txt >PROVENANCE.txt
          rm provenance-*.txt
          # GitHub would rename a pre-release's 2.0.0~rc.1 in an asset name.
          for deb in polywan_*~*.deb; do
            [ -e "$deb" ] && mv "$deb" "${deb//\~/.}"
          done
          sha256sum polywan-* polywan_*.deb THIRD-PARTY-LICENSES rust-std-copyright.html PROVENANCE.txt >SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Every file of the release, as published.
          subject-path: dist/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            case $version in
            *-*)
              echo "Release candidate $version of PolyWAN ${version%%-*}, for testing; not for production use."
              echo
              prerelease=--prerelease
              ;;
            esac
            # The section of CHANGELOG.md without its heading.
            awk -v v="${version%%-*}" '/^## / { on = index($0, "## " v " (") == 1; next } on' CHANGELOG.md
            echo
            echo "Verify a download with \`sha256sum --check --ignore-missing SHA256SUMS\` and \`gh attestation verify FILE --repo $GITHUB_REPOSITORY\`."
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag ${prerelease:+"$prerelease"} \
            --title "PolyWAN $version" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          # SHA256SUMS names the files as published.
          diff <(LC_ALL=C ls dist) <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)
