[workspace]
resolver = "3"
members = ["crates/fault-tolerant-router", "crates/testbed"]
# Spike crates are standalone throw-away experiments (spikes/README.md).
exclude = ["spikes"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/drsound/fault_tolerant_router"
authors = ["Alessandro Zarrilli <alessandro@zarrilli.net>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["socket", "uio", "net"] }
ipnet = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
